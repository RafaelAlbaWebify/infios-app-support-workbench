name: INFIOS CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          if ! python -m pip install -U pip > install.log 2>&1; then
            tail -n 120 install.log
            exit 1
          fi
          if ! pip install -e ".[dev]" >> install.log 2>&1; then
            tail -n 160 install.log
            exit 1
          fi
          echo "Dependencies installed successfully."

      - name: Run tests
        shell: bash
        run: |
          if ! pytest -q > pytest.log 2>&1; then
            echo "Pytest failed. Showing the final 160 lines:"
            tail -n 160 pytest.log
            exit 1
          fi
          cat pytest.log
